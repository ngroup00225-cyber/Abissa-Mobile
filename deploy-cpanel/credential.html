<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Badge Abissa 2026</title>
<style>body{margin:0;padding:24px;text-align:center;background:#edf3f8;color:#123;font:16px Arial}img{display:block;max-width:100%;max-height:80vh;margin:16px auto;box-shadow:0 8px 32px #1233}a{display:inline-block;padding:14px;background:#008def;color:white;border-radius:10px;margin:8px}</style>
<p id="status" role="status">Chargement du badge…</p><main id="badge"></main>
<script src="assets/qrcode.min.js?v=208"></script><script src="committee-data.js?v=208"></script><script src="credential.js?v=213"></script>
<script>
(async()=>{const status=document.getElementById('status');try{
const params=new URLSearchParams(location.search),id=params.get('id'),token=params.get('token');if(!id&&!token)throw new Error('Référence de badge manquante.');
const query=id?'id='+encodeURIComponent(id):'token='+encodeURIComponent(token);
const response=await fetch('api/verify-document?'+query,{cache:'no-store'});const result=await response.json();
if(!response.ok||!result.valid)throw new Error(result.error||'Badge indisponible.');
const isPass=result.document.type==='pass';const label=isPass?'Laissez-passer':'Badge';document.title=label+' Abissa 2026';
{
const verifyUrl=new URL('credential.html',location.href);verifyUrl.searchParams.set('id',result.document.id);
const src=await Credential.png(result.document,result.settings,verifyUrl.href),image=new Image();image.src=src;image.alt=label+' de '+result.document.data.name;
const link=document.createElement('a');link.href=src;link.download=(isPass?'laissez-passer-':'badge-')+result.document.id+'.png';link.textContent='Télécharger le '+label.toLowerCase()+' PNG';document.getElementById('badge').append(image,link);
}status.textContent=label+' disponible';
}catch(error){status.textContent=error.message;}})();
</script></html>
