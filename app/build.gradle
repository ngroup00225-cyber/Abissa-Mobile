plugins {
    id "com.android.application"
}

android {
    namespace "com.abissa.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "com.abissa.mobile"
        minSdk 23
        targetSdk 36
        versionCode 24
        versionName "2.1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies { implementation files("libs/zxing-core-3.5.3.jar") }
